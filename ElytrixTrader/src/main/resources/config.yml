# ═══════════════════════════════════════════════════════════════
#  ELYTRIXTRADER — Торговцы по всему миру | v1.0
# ═══════════════════════════════════════════════════════════════
#
# Всё работает с одним типом торговца — «Опытный Торговец».
# Торгуемые предметы задаются в игре: /etr edit
# Торговец живёт 2 часа и исчезает.

# === РАСПИСАНИЕ ПОЯВЛЕНИЯ ====================================
schedule:
  enabled: true
  # Время появления (ЧЧ:ММ, серверное время)
  times:
    - '00:00'
    - '04:00'
    - '08:00'
    - '12:00'
    - '16:00'
    - '20:00'

# === МЕСТО ПОЯВЛЕНИЯ =========================================
# Кольцо вокруг спавна мира
min-radius: 450
max-radius: 1400

# === ВРЕМЯ ЖИЗНИ =============================================
lifetime-seconds: 7200              # 2 часа

# === ВЗАИМОДЕЙСТВИЕ ==========================================
interaction-radius: 5.0             # с какого расстояния открывается меню
view-distance: 10                   # видимость виртуальных сущностей, в чанках (кап 16 = 256 блоков, дефолт 160)

# === АУРА ТОРГОВЦА ==========================================
# Тихий вихрь зелёных частиц вокруг торговца (мелкая зелёная «пыль» по
# наклонным орбитам + редкие зелёные искры). Строится на частицах — у них
# нет клиентской физики, поэтому аура движется идеально плавно при любом
# количестве игроков рядом (старую версию на виртуальных XP-орбах убрали:
# клиент 1.16.5 сам тянет орбы к игрокам ближе 8 блоков — не чинится).
aura:
  enabled: true

# === ЗВУКИ ===================================================
spawn-sound: ENTITY_PLAYER_LEVELUP  # звук при появлении торговца

# === ДРУГОЕ ==================================================
placeholderapi: true
debug: false