location:
  world: "world"
  x: 0
  y: 170
  z: 0
  spawn:
    x: 0.5
    y: 172.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

schematic:
  file: "paradise.schem"
  paste-on-startup: true
  clear-on-disable: true
  ignore-air: true
  offset-y: 0

# Запрещённые команды в регионе Райского места
blocked-commands:
  - "setwarp"
  - "warp"
  - "sethome"
  - "home"
  - "tp"
  - "tpa"
  - "tpaccept"
  - "spawn"

# Эффект утомления (Mining Fatigue) возле активных осколков
mining-fatigue:
  enabled: true
  level: 2 # Уровень утомления: 2 (Утомление II) или 3 (Утомление III)

# Настройки Центральной Сферы (Сердце Рая) и 6 цепей
sphere:
  max-hp: 200
  chain-hp: 50
  cooldown-seconds: 10800 # 3 часа перезарядки после полного истощения
  jump-boost:
    enabled: true
    level: 8 # Прыгучесть 8 уровня (космическая гравитация с мягким падением)
    room-radius: 15.0 # Радиус купольного зала храма (на 1 блок меньше)

actionbar:
  radius-xz: 150.0
  min-y: 0.0
  max-y: 256.0

shards:
  scan-radius-xz: 150
  scan-min-y: 0
  scan-max-y: 255
  cooldown-seconds: 600
  base-explosion-chance: 2.0
  chance-increase-per-hit: 1.5
  max-explosion-chance: 50.0
  explosion-damage: 24.0
  explosion-radius: 5.5
  hit-delay-ms: 800
  exp-min: 2
  exp-max: 6
  loot: {}
