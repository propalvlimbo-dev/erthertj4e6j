# Основная локация вставки и спавна ивента
# По умолчанию: X=0, Y=170, Z=0 в мире 'world'
location:
  world: "world"
  x: 0
  y: 170
  z: 0
  # Точка безопасного спавна игроков при телепортации (/ep tp)
  spawn:
    x: 0.5
    y: 172.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

# Настройки схематики
# Файл схематики поместите в: plugins/ElytrixParadise/schematics/paradise.schem
schematic:
  # Имя файла схематики в папке schematics/ (поддерживаются как .schem, так и .schematic)
  file: "paradise.schem"
  # Вставлять ли схематику автоматически при запуске плагина / сервера
  paste-on-startup: true
  # Удалять ли схематику при выключении / перезагрузке плагина
  clear-on-disable: true
  # Игнорировать ли блоки воздуха при вставке
  ignore-air: true
  # Дополнительное смещение по высоте Y при вставке
  offset-y: 0

# Настройки отображения Actionbar над хотбаром
actionbar:
  # Радиус по горизонтали (в блоках от X=0, Z=0)
  radius-xz: 45.0
  # Диапазон высоты Y (чтобы не отображалось игрокам, бегающим внизу по земле)
  min-y: 150.0
  max-y: 195.0

# Механика "Осколков Рая" (Красная глазурованная керамика)
shards:
  # Время перезарядки осколка после взрыва (в секундах: 600 сек = 10 минут)
  cooldown-seconds: 600
  # Начальный шанс взрыва при первом ударе (%)
  base-explosion-chance: 2.0
  # Увеличение шанса взрыва за каждый успешный удар (%)
  chance-increase-per-hit: 1.5
  # Максимальный шанс взрыва (%)
  max-explosion-chance: 50.0
  # Урон от взрыва осколка (24.0 HP = 12 сердец чистого урона, смертельно для игрока без брони, в железе или полу-алмазке)
  explosion-damage: 24.0
  # Радиус поражения взрывом (в блоках)
  explosion-radius: 5.5
  # Задержка между ударами для одного игрока в мс (для продолжительной добычи)
  hit-delay-ms: 800
  # Опыт, выпадающий при каждом ударе (сферы опыта)
  exp-min: 2
  exp-max: 6

  # Таблица лута, выпадающего на землю при каждом ударе киркой
  loot:
    diamond:
      material: "DIAMOND"
      min: 1
      max: 2
      chance: 25.0
      name: "&#FFFFA0✦ Райский Алмаз"
      lore:
        - "&7Добыт из священного"
        - "&#F8BEFBОсколка Рая"
    emerald:
      material: "EMERALD"
      min: 1
      max: 4
      chance: 40.0
      name: "&#A0FFA0✦ Небесный Изумруд"
    gold:
      material: "GOLD_INGOT"
      min: 2
      max: 6
      chance: 60.0
    iron:
      material: "IRON_INGOT"
      min: 3
      max: 8
      chance: 70.0
    golden_apple:
      material: "GOLDEN_APPLE"
      min: 1
      max: 1
      chance: 12.0
      name: "&#F8BEFB✦ Райское Яблоко"
    netherite_scrap:
      material: "NETHERITE_SCRAP"
      min: 1
      max: 1
      chance: 5.0
      name: "&#E070FF✦ Осколок Небесной Древности"
    exp_bottle:
      material: "EXPERIENCE_BOTTLE"
      min: 2
      max: 5
      chance: 50.0
