name: ElytrixParadise
version: 1.0.0
main: ru.rooyzee.elytrixparadise.Main
api-version: 1.16
author: rooyzee
depend: [WorldEdit, WorldGuard, DecentHolograms]
softdepend: [PlaceholderAPI, FastAsyncWorldEdit]
commands:
  elytrixparadise:
    description: Основная команда Райского места
    aliases: [ep, paradise]
    usage: /elytrixparadise help
  paradise:
    description: Телепортация и управление Райским местом
    aliases: [ep]
    usage: /paradise tp
permissions:
  elytrixparadise.admin:
    default: op
  elytrixparadise.tp:
    default: true
