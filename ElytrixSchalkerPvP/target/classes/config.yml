settings:
  min-sleep-minutes: 15
  max-sleep-minutes: 30
  loot-time-seconds: 60
  explosion-radius: 6
  explosion-damage: 16.0
  loot-cooldown-ms: 800 # Задержка между взятием предметов (в миллисекундах)

rarity-chances:
  COMMON: 75
  RARE: 40
  MYTHICAL: 15
  LEGENDARY: 5

rarity-display:
  COMMON:
    name: "Обычный"
    color: "&7"
    hex-color: "&#AAAAAA"
  RARE:
    name: "Редкий"
    color: "&9"
    hex-color: "&#5B9BF5"
  MYTHICAL:
    name: "Мифический"
    color: "&c"
    hex-color: "&#FF4D6A"
  LEGENDARY:
    name: "Легендарный"
    color: "&e"
    hex-color: "&#FFD700"

inventory-sizes:
  COMMON: 27
  RARE: 27
  MYTHICAL: 36
  LEGENDARY: 45

# Процент заполнения. Для 27 слотов: 22% = ~6 предметов, 45% = ~12 предметов.
loot-fill-percent:
  COMMON:
    min: 22
    max: 45
  RARE:
    min: 22
    max: 45
  MYTHICAL:
    min: 25
    max: 50
  LEGENDARY:
    min: 30
    max: 55

